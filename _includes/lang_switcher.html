<div class="r-lang">
  <a class="r-item" id="btn-it" onclick="setLang('it')">
    <div class="r-icon">IT</div>
    <span class="r-text">Italiano</span>
  </a>
  <a class="r-item" id="btn-en" onclick="setLang('en')">
    <div class="r-icon">EN</div>
    <span class="r-text">English</span>
  </a>
</div>

<script>
  function setLang(lang) {
    localStorage.setItem('lang', lang);
    document.documentElement.setAttribute('data-lang', lang);
    document.getElementById('btn-it').classList.toggle('active', lang === 'it');
    document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  }
  const saved = localStorage.getItem('lang') || 'it';
  setLang(saved);
</script>
