<a class="r-item" id="btn-lang" onclick="toggleLang()" style="margin-top: auto;">
  <div id="lang-flag" style="display:flex; flex-direction:column; gap:4px; align-items:center;">
    <div style="width:10px; height:10px; border-radius:3px;"></div>
    <div style="width:10px; height:10px; border-radius:3px;"></div>
    <div style="width:10px; height:10px; border-radius:3px;"></div>
  </div>
  <span class="r-text" id="lang-text">IT</span>
</a>

<script>
  const FLAGS = {
    it: ['#009246', '#ffffff', '#ce2b37'],
    en: ['#012169', '#c8102e', '#012169'],
  };

  function toggleLang() {
    const current = localStorage.getItem('lang') || 'it';
    setLang(current === 'it' ? 'en' : 'it');
  }

  function setLang(lang) {
    localStorage.setItem('lang', lang);
    document.documentElement.setAttribute('data-lang', lang);
    document.getElementById('lang-text').textContent = lang.toUpperCase();
    const colors = FLAGS[lang];
    const squares = document.querySelectorAll('#lang-flag div');
    squares.forEach((sq, i) => {
      sq.style.background = colors[i];
      sq.style.border = colors[i] === '#ffffff' ? '1px solid rgba(0,0,0,.15)' : 'none';
    });
    const bar = document.getElementById('lang-bar-btn');
    if (bar) bar.textContent = lang.toUpperCase();
    if (document.getElementById('intro-rows-area')) location.reload();
  }

  document.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('lang') || 'it';
  setLang(saved);
});
</script>
