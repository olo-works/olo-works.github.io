<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>

  <script>document.documentElement.setAttribute('data-lang', localStorage.getItem('lang') || 'it');</script>
  <style>
    html, body { height: 100%; overflow: hidden; }

    .home-wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 100vh;
      padding-left: 48px;
    }

    /* ── Left ── */
    .home-left {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 64px 56px;
      border-right: 1px solid var(--line);
      height: 100vh;
      overflow: hidden;
      font-size: 1rem;
    }
    .home-label {
      font-family: var(--mono);
      font-size: .58em;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--teal);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      animation: fadeUp .7s var(--ease) .1s forwards;
    }
    .home-label::before { content:''; display:block; width:24px; height:2px; background:var(--teal); }
    .home-name {
      font-size: clamp(2.6em, 4vw, 4em);
      font-weight: 800;
      letter-spacing: -.04em;
      line-height: .92;
      color: var(--ink);
      margin-bottom: 28px;
      opacity: 0;
      animation: fadeUp .8s var(--ease) .2s forwards;

    }
    .home-actions {
      display: flex;
      gap: 10px;
      opacity: 0;
      animation: fadeUp .8s var(--ease) .55s forwards;
    }

    /* ── Right ── */
    .home-right {
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .scroll-track {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 32px 0 32px 28px;
      width: fit-content;
      will-change: transform;
    }

    /* ── Image card ── */
    .img-item {
      display: block;
      width: fit-content;
      text-decoration: none;
      position: relative;
      flex-shrink: 0;
    }

    .img-item-photo {
      border-radius: 8px;
      overflow: hidden;
      width: 100%;
      border: 1.5px solid var(--line);
      transition: border-color .25s;
      position: relative;
      display: inline-block;
      /* No fixed height — images dictate their own height */
    }
    .img-item:hover .img-item-photo {
      border-color: var(--teal);
    }
      .img-item-photo img {
        width: auto;
        height: auto;
        max-width: 360px;
        max-height: 420px;
        display: block;
        object-fit: contain;
        transition: transform .5s var(--ease);
        position: relative;
        z-index: 1;
    }
    
    .img-item:hover .img-item-photo img { transform: scale(1.04); }

    .img-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2em;
      color: var(--teal);
      opacity: .3;
      background: var(--teal-xl);
      z-index: 0;
      min-height: 120px;
    }

    /* ── Side info panel ── */
    .img-side-info {
      position: absolute;
      left: calc(100% + 16px);
      top: 0;
      width: 150px;
      opacity: 0;
      transform: translateX(-8px);
      transition: opacity .25s var(--ease), transform .25s var(--ease);
      pointer-events: none;
      font-size: 1rem;
    }
    .img-item:hover .img-side-info {
      opacity: 1;
      transform: translateX(0);
    }
    .img-side-num {
      font-family: var(--mono);
      font-size: .52em;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--teal);
      margin-bottom: 6px;
    }
    .img-side-title {
      font-size: .95em;
      font-weight: 700;
      letter-spacing: -.02em;
      color: var(--ink);
      line-height: 1.2;
      margin-bottom: 6px;
    }
    .img-side-meta {
      font-family: var(--mono);
      font-size: .55em;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .img-side-link {
      font-family: var(--mono);
      font-size: .55em;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--teal);
      border-bottom: 1px solid rgba(43,173,184,.3);
      padding-bottom: 2px;
    }

    /* ── Responsive ── */
    @media(max-width:900px) {
      html, body { height: auto; overflow: auto; }
      .home-wrap {
        grid-template-columns: 1fr;
        height: auto;
        padding-left: 0;
      }
      .home-left {
        height: 100svh;
        overflow: visible;
        padding: 48px 24px 40px;
        border-right: none;
        border-bottom: none;
      }
      .home-right { display: none; }
    }
  </style>
</head>

<!-- Collect ALL images from every project (cover + gallery) -->
<script>
  // Build a flat array of { src, title, tag, year, url } from all projects
  const ALL_IMAGES = [
    {% assign all_projects = site.projects | sort: 'order' %}
    {% for project in all_projects %}
      {% if project.cover %}
      { src: "{{ project.cover }}", title: "{{ project.title }}", tag: "{{ project.tags[0] }}", year: "{{ project.year }}", url: "{{ project.url }}" },
      {% endif %}
      {% if project.gallery %}
        {% for img in project.gallery %}
      { src: "{{ img.src }}", title: "{{ project.title }}", tag: "{{ project.tags[0] }}", year: "{{ project.year }}", url: "{{ project.url }}" },
        {% endfor %}
      {% endif %}
    {% endfor %}
  ];
</script>

<script src="/main.js"></script>
<script>
  const track      = document.getElementById('scroll-track');
  const rightPanel = document.getElementById('home-right');
  const isMobile   = () => window.innerWidth <= 900;

  // ── Animation state ──────────────────────────────────────────────────────
  let offset    = 0;       // current translateY in px
  let speed     = 0;       // current speed (px/frame), eases toward targetSpeed
  let targetSpeed = 0;     // what speed we want to be at
  const AUTO_SPEED = 1.4;  // normal scrolling speed

  // ── Hover state ───────────────────────────────────────────────────────────
  let hovered = false;

  // ── Wheel manual scroll ───────────────────────────────────────────────────
  let wheelTarget = null;

  // ── Shuffle helper ────────────────────────────────────────────────────────
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ── Build a card from an image object ─────────────────────────────────────
  function makeCard(img, index) {
    const a = document.createElement('a');
    a.href = img.url;
    a.className = 'img-item';
    a.innerHTML = `
      <div class="img-item-photo">
        <img src="${img.src}" alt="${img.title}" loading="lazy"/>
        <div class="img-placeholder">◈</div>
      </div>
      <div class="img-side-info">
        <div class="img-side-num">0${index + 1}</div>
        <div class="img-side-title">${img.title}</div>
        <div class="img-side-meta">${img.tag} · ${img.year}</div>
        <div class="img-side-link">View →</div>
      </div>`;
    return a;
  }

  // ── Load a fresh batch of cards ───────────────────────────────────────────
  function loadBatch() {
    track.innerHTML = '';

    const batch = shuffle(ALL_IMAGES).slice(0, 5);
    batch.forEach((img, i) => track.appendChild(makeCard(img, i)));

    // Start below viewport, then ease into scrolling
    offset = window.innerHeight;
    track.style.transform = `translateY(${offset}px)`;
    speed = 0;
    wheelTarget = null;

    // Small delay before starting to scroll
    setTimeout(() => { targetSpeed = AUTO_SPEED; }, 600);
  }

  // ── Main animation loop ───────────────────────────────────────────────────
  let reloading = false;

  function animate() {
    if (!isMobile()) {

      if (hovered) {
        // Ease speed toward 0 — smooth stop
        speed += (0 - speed) * 0.08;

        if (wheelTarget !== null) {
          offset += (wheelTarget - offset) * 0.1;
          if (Math.abs(wheelTarget - offset) < 0.5) wheelTarget = null;
        } else {
          offset -= speed;
        }

      } else {
        // Ease speed back to AUTO_SPEED — smooth resume
        speed += (AUTO_SPEED - speed) * 0.06;
        wheelTarget = null;
        offset -= speed;

        // Reload when fully past viewport — never break the rAF loop
        if (!reloading && offset <= -(track.scrollHeight)) {
          reloading = true;
          speed = 0;
          setTimeout(() => { loadBatch(); reloading = false; }, 400);
        }
      }

      track.style.transform = `translateY(${offset}px)`;
    }

    requestAnimationFrame(animate); // always keep the loop alive
  }

  // ── Events ────────────────────────────────────────────────────────────────
  rightPanel.addEventListener('mouseenter', () => { hovered = true; });
  rightPanel.addEventListener('mouseleave', () => { hovered = false; wheelTarget = null; });

  rightPanel.addEventListener('wheel', (e) => {
    if (!hovered) return;
    e.preventDefault();
    if (wheelTarget === null) wheelTarget = offset;
    wheelTarget -= e.deltaY * 0.5;
  }, { passive: false });

  // ── Init ──────────────────────────────────────────────────────────────────
  if (!isMobile()) {
    loadBatch();
    animate();
  }
</script>
</body>
