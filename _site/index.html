  <style>
    html, body { height: 100%; }

    /* ══════════════════════════════════════════════════════════
       RAIL — force permanently open on the homepage.
       Not relying on the "rail-open" class alone: something (likely
       main.js) toggles width/label visibility on hover/mouseleave,
       which fights a class-only approach. This scopes to the
       homepage body class and wins regardless of what JS does.
       ══════════════════════════════════════════════════════════ */
    body.home-page #rail { width: 72px !important; }
    body.home-page #rail .r-text {
      opacity: 1 !important;
      max-height: 120px !important;
      margin-top: 2px !important;
    }

    /* ══════════════════════════════════════════════════════════
       PERIOD-ACCURATE PASS — flat, sharp, no blur.
       Scoped to the homepage. Rail ICONS (.r-icon) are deliberately
       untouched — those keep their existing radius, per instruction.
       Everything else on this page goes to 0.
       Cursor: shape only (square dot, square ring, no soft opacity
       fade) — the actual pointer motion/easing lives in main.js,
       outside this file, so it isn't touched here.
       ══════════════════════════════════════════════════════════ */
    body.home-page #rail { backdrop-filter: none !important; }
    body.home-page #cursor { border-radius: 0 !important; }
    body.home-page #cursor-ring { border-radius: 0 !important; opacity: .6 !important; }
    body.home-page #lang-bar-btn { border-radius: 0 !important; }

    /* ══════════════════════════════════════════════════════════
       HORIZONTAL PAGE SCROLL (desktop only)
       One outer scroller, panels laid out left-to-right, free-scroll
       (no snapping). Vertical wheel input is remapped to horizontal
       scroll via JS below, since that's not native browser behavior.
       ══════════════════════════════════════════════════════════ */
    .hz-wrap {
      margin-left: 72px; /* clears the rail, forced open above */
      height: 100vh;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .hz-wrap::-webkit-scrollbar { display: none; }

    .hz-track {
      display: flex;
      height: 100%;
      width: max-content;
    }

    .hz-panel {
      flex: 0 0 auto;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    /* ── Intro panel: bilingual scrolling marquee text only ── */
    .hz-intro {
      width: 22vw;
      min-width: 260px;
      max-width: 380px;
      padding: 0;
      border-right: 1px solid var(--line);
      overflow: hidden;
      position: relative; /* anchors the rotated/centered marquee below */
      container-type: inline-size; /* ties marquee text size to THIS panel, not the viewport */
      container-name: introMarquee;
    }
    .hz-marquee-area {
      /* Rotated 90deg. Sized oversize (100vh x 100vw) and centered so it
         always more than covers the panel regardless of the panel's exact
         width — the panel's own overflow:hidden crops it to a clean fit,
         so no fiddly exact-size math is needed. */
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vh;
      height: 100vw;
      transform: translate(-50%, -50%) rotate(-90deg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0;
    }
    .hz-marquee-row {
      display: flex;
      align-items: baseline;
      overflow: hidden;
      padding: 8px 0;
    }
    .hz-marquee-track {
      display: flex;
      align-items: baseline;
      white-space: nowrap;
      will-change: transform;
    }
    .hz-phrase-item {
      display: inline-flex;
      align-items: baseline;
      gap: .3em;
      padding: 0 20px;
      border-right: 1px solid var(--line);
      flex-shrink: 0;
    }
    .hz-phrase-main {
      font-family: var(--sans-wide);
      font-weight: 800;
      letter-spacing: -.03em;
      line-height: 1.15;
      font-size: var(--fs-h3);
      color: var(--ink);
    }
    .hz-phrase-main.teal { color: var(--teal); }

    /* ── Discipline panel: image fills the panel (5px padding, 5px
       radius — not literally full-bleed edge-to-edge), a bottom bar
       below it holds the title and a bordered arrow-link box. No
       description copy, no separate CTA text. ── */
    .hz-discipline {
      width: 48vw;
      min-width: 200px;
      max-width: 800px;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      height: 100%;
      container-type: inline-size; /* ties the title's font-size to THIS box's width, not the viewport */
      container-name: discipline;
    }
    .hz-discipline-media {
      flex: 1;
      min-height: 0;
      box-sizing: border-box;
    }
    .hz-discipline-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .hz-discipline-footer {
      flex-shrink: 0;
      display: flex;
      align-items: stretch;
      border-top: 1px solid var(--line);
      text-decoration: none;
      color: var(--ink);
    }
    .hz-discipline-title {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 40px 28px;
      font-size: clamp(1rem, 4.8cqw, 2.75rem); /* scales to panel width via container-type above */
      font-weight: 800;
      letter-spacing: -.03em;
      color: var(--ink);
      margin: 0;
    }
    .hz-discipline-arrow {
      width: 88px;
      flex-shrink: 0;
      border-left: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-m);
      transition: color .2s, background .2s;
    }
    .hz-discipline-arrow svg { width: 34px; height: 34px; }
    .hz-discipline-footer:hover .hz-discipline-arrow {
      color: var(--teal);
      background: rgba(43,173,184,.06);
    }

    /* ── Discovery panel: 4 columns, alternating vertical auto-scroll ── */
    .hz-discovery {
      width: 44vw;
      min-width: 480px;
      padding: 40px 32px;
      overflow: hidden;
    }
    .hz-discovery-grid {
      display: flex;
      gap: 10px;
      height: 100%;
    }
    .hz-col {
      flex: 1;
      overflow: hidden;
      position: relative;
      height: 100%;
    }
    .hz-col-track {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      will-change: transform;
    }
    .hz-col-track img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 0;
      border: 1px solid var(--line);
    }

    /* ══════════════════════════════════════════════════════════
       MOBILE — everything becomes a normal vertical stack.
       Intro is OMITTED entirely (not shortened). Rail reverts to
       whatever its default mobile behavior already is (#mob bar).
       ══════════════════════════════════════════════════════════ */
    @media (max-width: 900px) {
      #rail { display: none; }

      .hz-wrap {
        margin-left: 0;
        height: auto;
        overflow: visible;
      }
      .hz-track {
        display: block;
        width: 100%;
        height: auto;
      }
      .hz-panel { height: auto; }

      .hz-intro { display: none; }

      .hz-discipline {
        width: 100%;
        min-width: 0;
        border-right: none;
        border-bottom: 1px solid var(--line);
        height: auto;
        /* Short on mobile: aspect-ratio kept within the 4:5–16:9 range,
           landing near the 16:9 end so the panel reads as a strip, not
           a full-height hero. Adjust this ratio alone to taste. */
        aspect-ratio: 16 / 9;
        min-height: 0;
      }
      .hz-discipline-media { padding: 5px; }
      .hz-discipline-title { padding: 16px 20px; font-size: var(--fs-h4); }
      .hz-discipline-arrow { width: 76px; }
      .hz-discipline-arrow svg { width: 30px; height: 30px; }

      .hz-discovery {
        width: 100%;
        min-width: 0;
        padding: 24px 20px;
        height: 60vh;
      }
    }
  </style>

<script>
  const FLAGS = {
    it: ['#009246', '#ffffff', '#ce2b37'],
    en: ['#012169', '#c8102e', '#012169'],
  };

  function toggleLang() {
    const current = localStorage.getItem('lang') || 'it';
    setLang(current === 'it' ? 'en' : 'it');
  }

  function setLang(lang) {
    localStorage.setItem('lang', lang);
    document.documentElement.setAttribute('data-lang', lang);
    document.getElementById('lang-text').textContent = lang.toUpperCase();
    const colors = FLAGS[lang];
    const squares = document.querySelectorAll('#lang-flag div');
    squares.forEach((sq, i) => {
      sq.style.background = colors[i];
      sq.style.border = colors[i] === '#ffffff' ? '1px solid rgba(0,0,0,.15)' : 'none';
    });
    const bar = document.getElementById('lang-bar-btn');
    if (bar) bar.textContent = lang.toUpperCase();
  }

  document.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('lang') || 'it';
  setLang(saved);
});
</script>

<script>
(function() {

  // ═══════════════════════════════════════════════════════════════
  // OUTER HORIZONTAL SCROLL — remap vertical wheel input to horizontal
  // scroll. Free-scroll, no snapping. Desktop only (mobile uses normal
  // vertical document flow, this listener is skipped there via width check).
  // ═══════════════════════════════════════════════════════════════
  const hzWrap = document.getElementById('hzWrap');
  const isMobile = () => window.innerWidth <= 900;

  hzWrap.addEventListener('wheel', (e) => {
    if (isMobile()) return; // let native vertical scroll happen
    // If the dominant gesture is already horizontal (trackpad), don't fight it.
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
    e.preventDefault();
    hzWrap.scrollLeft += e.deltaY;
  }, { passive: false });

  // ═══════════════════════════════════════════════════════════════
  // DISCOVERY CAROUSEL — 4 independent columns, alternating direction,
  // same shuffle/reload logic as the old single-column feed, just run
  // 4× in parallel with alternating sign on speed.
  // ═══════════════════════════════════════════════════════════════
  const grid = document.getElementById('discoveryGrid');
  const COL_COUNT = 4;
  const SPEED = 0.6;
  const IMAGES_PER_COL = 6;

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildColumn(index) {
    const col = document.createElement('div');
    col.className = 'hz-col';

    const track = document.createElement('div');
    track.className = 'hz-col-track';
    col.appendChild(track);

    const direction = index % 2 === 0 ? -1 : 1; // alternate up/down
    let offset = direction === -1 ? 0 : -9999; // set properly after first render
    let speed = SPEED * direction;

    function fillBatch() {
      track.innerHTML = '';
      const batch = shuffle(ALL_IMAGES).slice(0, IMAGES_PER_COL);
      batch.forEach(imgData => {
        const img = document.createElement('img');
        img.src = imgData.src;
        img.alt = imgData.title;
        img.loading = 'lazy';
        track.appendChild(img);
      });
    }

    fillBatch();

    function animate() {
      // Read current transform position
      const style = window.getComputedStyle(track);
      const matrix = new DOMMatrixReadOnly(style.transform);
      let y = matrix.m42 + speed;

      const trackHeight = track.scrollHeight;
      const colHeight = col.clientHeight;

      if (direction === -1 && y <= -trackHeight) {
        y = colHeight;
        fillBatch();
      } else if (direction === 1 && y >= colHeight) {
        y = -trackHeight;
        fillBatch();
      }

      track.style.transform = `translateY(${y}px)`;
      requestAnimationFrame(animate);
    }

    // Stagger the start position so columns don't look synced
    track.style.transform = direction === -1
      ? `translateY(0px)`
      : `translateY(-${track.scrollHeight}px)`;

    requestAnimationFrame(animate);
    return col;
  }

  for (let i = 0; i < COL_COUNT; i++) {
    grid.appendChild(buildColumn(i));
  }

})();
</script>

<script>

  // INTRO PANEL — bilingual scrolling marquee, ported from the About

  // ═══════════════════════════════════════════════════════════════
  const PHRASES = [

    { it: "Una Nikon D7000 per documentare un mondo che va troppo veloce", en: "Using a Nikon D7000 to document a world that is moving too fast" },
    { it: "Una carriera costruita all'intersezione tra una costa rocciosa e uno schermo", en: "A career built on the intersection of a rocky coastline and a computer screen" },
    { it: "Oggetti che sembrano usciti da un film di fantascienza ad alto budget del 2001", en: "Designing objects that look like they belong in a high budget sci-fi from 2001" },
    { it: "Un futuro dove ogni superficie è cromata e ogni pulsante è fisico", en: "A future where every surface is chrome and every button is a physical click" },
    { it: "Passo i weekend a guardare pezzi di macchine che non posso ancora permettermi", en: "I spend my weekends looking at car parts I cannot afford to install yet" },
    { it: "Lavoro con strumenti come Rhino 8 e Blender", en: "Operating with tools like Rhino 8 and Blender" },
    { it: "Comunico in italiano, inglese e francese", en: "Communicating in Italian, English and French" },
    { it: "Modernismo italiano del dopoguerra", en: "Mid-century Italian modernism" },
    { it: "Specializzato nello sviluppo di scocche per elettronica di consumo", en: "Specializing in the development of enclosures for consumer electronics" },
    { it: "Mixo audio e campioni in Ableton Live", en: "Mixing audio and samples within Ableton Live" },
    { it: "Ho bisogno delle forbici! 61!", en: "I need scissors! 61!" },
    { it: "Eliminare il non essenziale", en: "Eliminating the non-essential" },
    { it: "rcaronn era un'era bellissima", en: "rcaronn was such a cool era" },
    { it: "Blender Render", en: "Blender Render" },
    { it: "Quanto mi piacciono le macchine", en: "Man i love cars" },
    { it: "Quanto mi piacciono i veicoli", en: "Man i love vehicles" },
    { it: "Quella volta che", en: "Quella volta che" },
    { it: "Ogni scelta di design deve difendere la propria esistenza", en: "Every design decision must defend its existence" },
    { it: "Gran Turismo 4 ha ancora la mia UI preferita di sempre", en: "Gran Turismo 4 still has my favourite UI of all time" },
  ];
  const NUM_ROWS        = 4;
  const SLOW_FACTOR     = 0.08;
  const BASE_SEQ_LENGTH = 12;

  const PALETTE = [
    'var(--ink)',
    'var(--teal)',
    'var(--muted)',
  ];

  (function initHomeMarquee(){
    const area = document.getElementById('hzMarqueeArea');
    if (!area) return;

    const buckets = Array.from({length: NUM_ROWS}, () => {
      const seq = [];
      for (let i = 0; i < BASE_SEQ_LENGTH; i++) {
        const phrase = PHRASES[Math.floor(Math.random() * PHRASES.length)];
        const color = PALETTE[i % PALETTE.length];
        seq.push({ phrase, color });
      }
      return seq;
    });

    const rows = [];

    buckets.forEach((phrases, ri) => {
      const baseSpeed = 18 + Math.random() * 40;
      const dir       = ri % 2 === 0 ? 1 : -1;

      const rowEl = document.createElement('div');
      rowEl.className = 'hz-marquee-row';
      const track = document.createElement('div');
      track.className = 'hz-marquee-track';

      function makeItems() {
        const frag = document.createDocumentFragment();
        phrases.forEach(p => {
          const item = document.createElement('div');
          item.className = 'hz-phrase-item';

          const main = document.createElement('span');
          main.className = 'hz-phrase-main';
          main.style.color = p.color;
          main.innerHTML = `<span class="lang it">${p.phrase.it}</span><span class="lang en">${p.phrase.en}</span>`;
          item.appendChild(main);
          frag.appendChild(item);
        });
        return frag;
      }

      for (let k = 0; k < 30; k++) {
        track.appendChild(makeItems());
      }

      rowEl.appendChild(track);
      area.appendChild(rowEl);

      rows.push({ rowEl, track, baseSpeed, dir, pos: 0, hovered: false, currentSpeed: baseSpeed, singleW: 0 });
      rowEl.addEventListener('mouseenter', () => rows[ri].hovered = true);
      rowEl.addEventListener('mouseleave', () => rows[ri].hovered = false);
    });

    function updateWidths() {
      rows.forEach(row => {
        const children = Array.from(row.track.children);
        row.singleW = children.slice(0, BASE_SEQ_LENGTH).reduce((s, c) => s + c.offsetWidth, 0);
        if (row.pos >= row.singleW) {
          row.pos = row.pos % row.singleW || 0;
        }
      });
    }

    requestAnimationFrame(() => requestAnimationFrame(() => {
      updateWidths();

      rows.forEach(row => { row.pos = Math.random() * row.singleW; });
      window.addEventListener('resize', updateWidths);

      let last = null;
      function tick(ts) {
        if (!last) last = ts;
        const dt = Math.min((ts - last) / 1000, 0.05);
        last = ts;

        rows.forEach(row => {
          const target = row.hovered ? row.baseSpeed * SLOW_FACTOR : row.baseSpeed;
          row.currentSpeed += (target - row.currentSpeed) * 0.06;
          row.pos += row.dir * row.currentSpeed * dt;

          if (row.pos >= row.singleW) row.pos -= row.singleW;
          if (row.pos < 0) row.pos += row.singleW;

          row.track.style.transform = `translateX(${-row.pos}px)`;
        });

        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }));
  })();
</script>
